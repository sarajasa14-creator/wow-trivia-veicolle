<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0B1A">
  <title>WoW Trivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">WoW Trivia</span>
    <div class="topright">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="fi">FI</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="muteBtn" class="iconbtn" aria-label="Sound">🔊</button>
      <button type="button" id="leaveBtn" class="iconbtn" aria-label="Leave" hidden>✕</button>
    </div>
  </header>

  <main id="app">
    <p class="loading">Loading… (this game needs a modern browser with JavaScript enabled)</p>
  </main>

  <div id="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <footer id="footer">Unofficial fan project. Not affiliated with Blizzard Entertainment. World of Warcraft and Warcraft are trademarks of Blizzard Entertainment, Inc.</footer>

  <noscript><p class="loading">JavaScript is required to play.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
